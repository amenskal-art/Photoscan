name: Build APK

# Manual only. Push and pull_request triggers are deliberately absent, so editing files
# never starts a build. Run it from the Actions tab: pick "Build APK", then "Run workflow".
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which APK to build"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        if: github.event.inputs.variant == 'debug' || github.event.inputs.variant == 'both'
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        if: github.event.inputs.variant == 'release' || github.event.inputs.variant == 'both'
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        if: github.event.inputs.variant == 'debug' || github.event.inputs.variant == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: photoscan-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: github.event.inputs.variant == 'release' || github.event.inputs.variant == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: photoscan-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
